name: Build Windows desktop app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm ci
        working-directory: desktop

      - run: npm run dist
        working-directory: desktop

      # Download this from the run's Summary page, unzip it, and run BattleAnts.exe.
      # The same folder is what gets uploaded to Steam.
      - uses: actions/upload-artifact@v4
        with:
          name: Battle-Ants-Windows
          path: desktop/dist/win-unpacked
